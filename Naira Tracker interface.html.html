<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NERT</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: darkgray;
            color: #333;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 450px;
            margin: 0 auto;
        }
        h2 {
            margin-top: 10px;
            color: #111;
            font-size: 1.3rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            background-color: purple;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0051cb;
        }
        .status-msg {
            margin-top: 12px;
            font-size: 0.85rem;
            text-align: center;
            color: #22c55e;
            font-weight: 500;
        }
        .chart-container {
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-container img {
            max-height: 90px;
            width: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-container">
            <img src="FUTMINNA LOGO.jpeg" alt="FUTMINNA Logo">
        </div>

        <h2>Set Rate Alert Threshold</h2>
        <form id="thresholdForm">
            <div class="form-group">
                <label for="currencySelect">Select Currency</label>
                <select id="currencySelect" required>
                    <option value="USD">USD ($)</option>
                    <option value="GBP">GBP (£)</option>
                    <option value="EUR">EUR (€)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="conditionSelect">Trigger Condition</label>
                <select id="conditionSelect" required>
                    <option value="above">Goes Above (&gt;)</option>
                    <option value="below">Falls Below (&lt;)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="thresholdInput">Target Rate (in ₦)</label>
                <input type="number" id="thresholdInput" placeholder="e.g. 1500" step="0.01" min="0" required>
            </div>

            <button type="submit">Save Alert Rule</button>
        </form>
        
        <div id="statusMessage" class="status-msg"></div>

        <div class="chart-container">
            <canvas id="rateHistoryChart" width="400" height="250"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="New Project.js"></script>
</body>
</html>
