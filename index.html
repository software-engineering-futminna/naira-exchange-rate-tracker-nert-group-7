<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NERT - Naira Exchange Rate Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e293b;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 500px;
            width: 100%;
        }
        .card {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            margin-top: 10px;
            color: #111;
            font-size: 1.3rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            background-color: purple;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0051cb;
        }
        .btn-secondary {
            background-color: #475569;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }
        .status-msg {
            margin-top: 12px;
            font-size: 0.85rem;
            text-align: center;
            color: #22c55e;
            font-weight: 500;
            min-height: 20px;
        }
        .chart-container {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-container img {
            max-height: 90px;
            width: auto;
            object-fit: contain;
        }
        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #f8fafc;
            font-weight: 600;
        }
        .rate-up {
            color: #22c55e;
            font-weight: bold;
        }
        .rate-down {
            color: #ef4444;
            font-weight: bold;
        }
        .rate-stable {
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="logo-container">
                <img src="FUTMINNA LOGO.jpeg" alt="FUTMINNA Logo">
            </div>

            <h2>Set Rate Alert Threshold</h2>
            <form id="thresholdForm">
                <div class="form-group">
                    <label for="currencySelect">Select Currency</label>
                    <select id="currencySelect" required>
                        <option value="USD">USD ($)</option>
                        <option value="GBP">GBP (£)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="CAD">CAD ($)</option>
                        <option value="GHS">GHS (₵)</option>
                        <option value="ZAR">ZAR (R)</option>
                        <option value="AED">AED (د.إ)</option>
                        <option value="CNY">CNY (¥)</option>
                        <option value="JPY">JPY (¥)</option>
                        <option value="SAR">SAR (ر.س)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="conditionSelect">Trigger Condition</label>
                    <select id="conditionSelect" required>
                        <option value="above">Goes Above (&gt;)</option>
                        <option value="below">Falls Below (&lt;)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="thresholdInput">Target Rate (in ₦)</label>
                    <input type="number" id="thresholdInput" placeholder="e.g. 1500" step="0.01" min="0" required>
                </div>

                <button type="submit">Save Alert Rule</button>
            </form>
            
            <div id="statusMessage" class="status-msg"></div>
        </div>

        <!-- NEW COMPLIANT SECTION: 10 Currencies Live Table with Indicators -->
        <div class="card">
            <h2>Naira Exchange Rates (Base: ₦1 NGN)</h2>
            <table id="ratesTable">
                <thead>
                    <tr>
                        <th>Currency</th>
                        <th>Rate (₦)</th>
                        <th>Change</th>
                    </tr>
                </thead>
                <tbody id="ratesTableBody">
                    <tr>
                        <td colspan="3" style="text-align: center; color: #64748b;">Loading live rates...</td>
                    </tr>
                </tbody>
            </table>
            <button id="exportCsvBtn" class="btn-secondary">Export Rate Table as CSV</button>
        </div>

        <div class="card">
            <h2>Historical Trend (Last 7 Sessions)</h2>
            <div class="chart-container">
                <canvas id="rateHistoryChart" width="400" height="250"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="New Project.js"></script>
</body>
</html>
