<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NERT - Naira Exchange Rate Tracker</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #1e293b;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 600px;
            width: 100%;
        }
        .card {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            margin-top: 5px;
            color: #111;
            font-size: 1.3rem;
            text-align: center;
        }
        .sub-header {
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
            margin-bottom: 15px;
            margin-top: -5px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            background-color: purple;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0051cb;
        }
        .btn-secondary {
            background-color: #475569;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }
        .status-msg {
            margin-top: 12px;
            font-size: 0.85rem;
            text-align: center;
            color: #22c55e;
            font-weight: 500;
            min-height: 20px;
        }
        .banner-warning {
            background-color: #fef3c7;
            color: #92400e;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .timestamp-badge {
            display: inline-block;
            background: #e2e8f0;
            color: #334155;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 10px;
        }
        .logo-container img {
            max-height: 80px;
            width: auto;
            object-fit: contain;
        }
        /*  Indicators */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #f8fafc;
            font-weight: 600;
        }
        .rate-up {
            color: #22c55e;
            font-weight: bold;
        }
        .rate-down {
            color: #ef4444;
            font-weight: bold;
        }
        .rate-stable {
            color: #64748b;
        }
        .highlight-alert {
            background-color: #fef2f2 !important;
            border-left: 4px solid #ef4444;
        }
        /* Calculator Toggle */
        .market-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .market-toggle label {
            flex: 1;
            text-align: center;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .market-toggle input[type="radio"] {
            display: none;
        }
        .market-toggle input[type="radio"]:checked + span {
            font-weight: bold;
            color: purple;
        }
    </style>
</head>
<body>

    <div class="container">
        <!--  OFFLINE DATA -->
        <div id="systemBanner" class="banner-warning">
            ⚠️ Rates last verified <span id="lastVerifiedTime">5</span> minutes ago due to network delays.
        </div>

        <div class="card">
            <div class="logo-container">
                <img src="FUTMINNA LOGO.jpeg" alt="FUTMINNA Logo">
            </div>
            <h2>NERT Dual-Market Dashboard</h2>
            <div class="sub-header">Department of Software Engineering (SICT)</div>
            
            <div style="text-align: center;">
                <span class="timestamp-badge" id="liveTimestamp">Updated: Just now</span>
            </div>

            <!-- CURRENCIES -->
            <table id="ratesTable">
                <thead>
                    <tr>
                        <th>Currency</th>
                        <th>Rate (₦)</th>
                        <th>Change</th>
                    </tr>
                </thead>
                <tbody id="ratesTableBody">
                    <tr>
                        <td colspan="3" style="text-align: center; color: #64748b;">Loading live rates...</td>
                    </tr>
                </tbody>
            </table>
            <button id="exportCsvBtn" class="btn-secondary">Export Rate Table as CSV</button>
        </div>

        <!--  CALCULATOR(Freelancer) -->
        <div class="card">
            <h2>Freelancer Rate Calculator</h2>
            <div class="market-toggle">
                <label>
                    <input type="radio" name="calcMarket" value="street" checked>
                    <span>Parallel Market</span>
                </label>
                <label>
                    <input type="radio" name="calcMarket" value="official">
                    <span>Official NAFEM</span>
                </label>
            </div>
            <div class="form-group">
                <label for="calcAmount">Amount in Foreign Currency</label>
                <input type="number" id="calcAmount" placeholder="e.g. 500" min="0">
            </div>
            <div class="form-group">
                <label for="calcCurrency">Currency</label>
                <select id="calcCurrency">
                    <option value="USD">USD ($)</option>
                    <option value="GBP">GBP (£)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="CAD">CAD ($)</option>
                    <option value="GHS">GHS (₵)</option>
                    <option value="ZAR">ZAR (R)</option>
                    <option value="AED">AED (د.إ)</option>
                    <option value="CNY">CNY (¥)</option>
                    <option value="JPY">JPY (¥)</option>
                    <option value="SAR">SAR (ر.س)</option>
                </select>
            </div>
            <div style="margin-top: 10px; font-size: 1.1rem; text-align: center; font-weight: bold;">
                Estimated Value: <span id="calcResult" style="color: purple;">₦0.00</span>
            </div>
        </div>

        <!--TARGET RATE ALERT FORM -->
        <div class="card">
            <h2>Set Target Rate Alert</h2>
            <form id="thresholdForm">
                <div class="form-group">
                    <label for="userEmail">Your Email Address</label>
                    <input type="email" id="userEmail" placeholder="student@futminna.edu.ng" required>
                </div>

                <div class="form-group">
                    <label for="currencySelect">Select Currency</label>
                    <select id="currencySelect" required>
                        <option value="USD">USD ($)</option>
                        <option value="GBP">GBP (£)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="CAD">CAD ($)</option>
                        <option value="GHS">GHS (₵)</option>
                        <option value="ZAR">ZAR (R)</option>
                        <option value="AED">AED (د.إ)</option>
                        <option value="CNY">CNY (¥)</option>
                        <option value="JPY">JPY (¥)</option>
                        <option value="SAR">SAR (ر.س)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="conditionSelect">Trigger Condition</label>
                    <select id="conditionSelect" required>
                        <option value="above">Goes Above (&gt;)</option>
                        <option value="below">Falls Below (&lt;)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="thresholdInput">Target Rate (in ₦)</label>
                    <input type="number" id="thresholdInput" placeholder="e.g. 1550" step="0.01" min="0" required>
                </div>

                <button type="submit">Save Target Alert Rule</button>
            </form>
            
            <div id="statusMessage" class="status-msg"></div>
        </div>

        <!-- CHART AND CURRENCY PAIR SELECTOR -->
        <div class="card">
            <h2>Historical Trend</h2>
            <div class="form-group">
                <label for="chartCurrencySelect">Select Currency Pair for Chart</label>
                <select id="chartCurrencySelect">
                    <option value="USD">USD to NGN</option>
                    <option value="GBP">GBP to NGN</option>
                    <option value="EUR">EUR to NGN</option>
                    <option value="CAD">CAD to NGN</option>
                </select>
            </div>
            <div class="chart-container">
                <canvas id="rateHistoryChart" width="400" height="200"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="New Project.js"></script>
</body>
</html>ss
